<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./" />
  <title>Epochlypse Research // Redirecting</title>
  <script>
    // GitHub Pages SPA redirect
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="background:#050505; color:#ffffff; font-family:monospace; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>[EPOCHLYPSE SYSTEM] Redirecting to root...</p>
</body>
</html>
